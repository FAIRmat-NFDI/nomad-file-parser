site_name: nomad-file-parser
site_description: A collection of Python utilities for parsing files in NOMAD.
site_author: FAIRmat

repo_url: https://github.com/FAIRmat-NFDI/nomad-file-parser
edit_uri: ""

nav:
  - Home: index.md
  - How-to guides:
      - Parse text files: howto/text-parser.md
      - Parse with mapping annotations: howto/mapping-parser.md
  - Reference:
      - API: reference/api.md
plugins:
  - search
theme:
  name: material
  palette:
    primary: "#2A4CDF"
    accent: "#008A67"
  font:
    text: "Titillium Web"
  features:
    - navigation.instant
  icon:
    repo: fontawesome/brands/github
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: True
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.extra
extra:
  generator: false
  homepage: https://nomad-lab.eu
use_directory_urls: false
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
